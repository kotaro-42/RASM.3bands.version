<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    >
    <meta name="theme-color" content="#000000">
    <meta name="rnbo-version" content="1.0.0-alpha.5">

    <title>RASM demo</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <!-- 背景 -->
    <svg id="background" width="100%" height="100%"></svg>

    <div id="rnbo-root">
        <div class="title-row">
            <div class="title-heading">
                <h1
                    id="custom-title"
                    class="help-trigger"
                    data-help="マイクによる環境音取得を前提とした追従型の快適音出力システム。ピンクノイズに調整を加えるシステムのみのdemo版"
                >RASM demo</h1>
                <div class="help-panel" aria-hidden="true"></div>
            </div>

            <div
                class="title-volume"
                data-help="出力の音量を調節するボリュームメーター。音が単に小さい場合右へ。"
            >
                <span
                    class="title-volume-label help-trigger"
                    data-help="出力の音量を調節するボリュームメーター。音が単に小さい場合右へ。"
                >volume</span>
                <div class="help-panel" aria-hidden="true"></div>
                <div class="horizontal-slider-container volume-slider-container">
                    <!-- volume 0〜10（11段階）→ steps=10。両端目盛りは描画しない -->
                    <div class="slider-ticks" data-steps="10"></div>
                    <div id="bar" class="volume-meter-fill"></div>
                    <!-- 初期値は export/rasm_origin.json の volume.initialValue=7 に合わせる -->
                    <input
                        type="range"
                        id="volume-slider"
                        class="horizontal-slider"
                        min="0"
                        max="10"
                        step="1"
                        value="7"
                    >
                </div>
            </div>

            <div
                class="title-samplerate"
                data-help="サンプルレートの選択。基本48kHzのままで問題ないです。"
            >
                <!-- オフ=48kHz（初期） / オン=44.1kHz / スマホでは非表示 -->
                <label class="sr-switch" for="samplerate-toggle">
                    <input
                        type="checkbox"
                        id="samplerate-toggle"
                        role="switch"
                        aria-label="44.1kHz sample rate"
                    >
                    <span class="sr-switch-track" aria-hidden="true">
                        <span class="sr-switch-thumb"></span>
                    </span>
                    <span class="sr-switch-caption">44.1kHz</span>
                </label>
            </div>
        </div>

        <div class="controls-container">

            <!-- ───────── Tuning ───────── -->
            <div class="tuning-section">
                <div class="tuning-control">

                    <!-- Sensitivity -->
                    <div
                        class="slider-group"
                        data-help="小さい音に反応する度合いを調節。もっとマスキングしたい場合右へ。"
                    >
                        <span
                            class="slider-label help-trigger"
                            data-help="小さい音に反応する度合いを調節。もっとマスキングしたい場合右へ。"
                        >sensitivity</span>
                        <div class="help-panel" aria-hidden="true"></div>
                        <div class="horizontal-slider-container">
                            <div class="slider-ticks" data-steps="12"></div>
                            <!-- RNBO sensitivity.initialValue=7・UIは逆転表示なので 12-7=5 -->
                            <input
                                type="range"
                                id="sensitivity-slider"
                                class="horizontal-slider"
                                min="0"
                                max="12"
                                step="1"
                                value="5"
                            >
                        </div>
                    </div>

                    <!-- Dynamics -->
                    <div
                        class="slider-group"
                        data-help="最大音を出す閾値を調節。変化があまりないと感じる場合右へ。"
                    >
                        <span
                            class="slider-label help-trigger"
                            data-help="最大音を出す閾値を調節。変化があまりないと感じる場合右へ。"
                        >dynamics</span>
                        <div class="help-panel" aria-hidden="true"></div>
                        <div class="horizontal-slider-container">
                            <div class="slider-ticks" data-steps="4"></div>
                            <!-- RNBO dynamics.initialValue=4 -->
                            <input
                                type="range"
                                id="dynamics-slider"
                                class="horizontal-slider"
                                min="0"
                                max="4"
                                step="1"
                                value="4"
                            >
                        </div>
                    </div>

                    <!-- Responsiveness -->
                    <div
                        class="slider-group"
                        data-help="どのくらい騒音上昇についていくかを調節。もう少し反応している感が欲しい場合右へ。"
                    >
                        <span
                            class="slider-label help-trigger"
                            data-help="どのくらい騒音上昇についていくかを調節。もう少し反応している感が欲しい場合右へ。"
                        >responsiveness</span>
                        <div class="help-panel" aria-hidden="true"></div>
                        <div class="horizontal-slider-container">
                            <div class="slider-ticks" data-steps="10"></div>
                            <!-- RNBO responsiveness.initialValue=4・UIは逆転表示なので 10-4=6 -->
                            <input
                                type="range"
                                id="responsiveness-slider"
                                class="horizontal-slider"
                                min="0"
                                max="10"
                                step="1"
                                value="6"
                            >
                        </div>
                    </div>

                    <!-- Release -->
                    <div
                        class="slider-group"
                        data-help="どのくらい環境音の下降についていくかを調節。もう少しマスキングが尾を引いて欲しい場合右へ。"
                    >
                        <span
                            class="slider-label help-trigger"
                            data-help="どのくらい環境音の下降についていくかを調節。もう少しマスキングが尾を引いて欲しい場合右へ。"
                        >release</span>
                        <div class="help-panel" aria-hidden="true"></div>
                        <div class="horizontal-slider-container">
                            <div class="slider-ticks" data-steps="10"></div>
                            <!-- RNBO release.initialValue=4 -->
                            <input
                                type="range"
                                id="release-slider"
                                class="horizontal-slider"
                                min="0"
                                max="10"
                                step="1"
                                value="4"
                            >
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- PC専用: カーソル追従ヘルプ -->
    <div id="help-tooltip" class="help-tooltip" aria-hidden="true">
        <div class="help-tooltip-body"></div>
    </div>

    <!-- Scripts -->
    <script src="js/guardrails.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
